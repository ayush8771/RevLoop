<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RevLoop — Recoveries</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">R</div>
      <div><h1>RevLoop</h1><span>Recovery Loop Agent</span></div></div>
    <nav>
      <a class="nav-item" href="index.html">Dashboard</a>
      <a class="nav-item active" href="recoveries.html">Recoveries</a>
    </nav>
    <div class="sidebar-bottom">
      <span class="honesty-note" id="mode-note"></span>
    </div>
  </aside>
  <main class="main">
    <div class="panel-header"><h2>Recoveries</h2></div>
    <div class="panel transactions-panel">
      <div class="table-wrapper">
        <table class="ev-table" id="rec-table">
          <thead><tr>
            <th>Payment</th><th>Diagnosis</th><th>Action</th><th>State</th>
            <th>Gross</th><th>Discount</th><th>Net recovered</th><th>Link</th><th></th>
          </tr></thead>
          <tbody><tr><td colspan="9" class="loading">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="common.js"></script>
<script>
(async () => {
  try {
    const h = await api("/health");
    document.getElementById("mode-note").innerHTML = modeBannerHtml(h.mock_mode);
  } catch (e) {
    document.getElementById("mode-note").textContent = "Status unavailable";
  }

  const tbody = document.querySelector("#rec-table tbody");
  try {
    const rows = await api("/recoveries");
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="loading">No recoveries yet.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(t => txnRow(t, true)).join("");
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="9" class="loading">Couldn't load recoveries — ${e.message}</td></tr>`;
  }
})();
</script>
</body>
</html>
